# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: JHU Applied Physics Lab Amateur Radio Club
email: W3APL@jhuapl.edu
description: >- # this means to ignore newlines until "baseurl:"
  The QSL Home to the Johns Hopkins Applied Physics Labs (APL) Amateur Radio
  Club, W3APL.
baseurl: "/w3apl" # the subpath of your site, e.g. /blog
url: "https://qsl.net" # the base hostname & protocol for your site, e.g. http://example.com
domain: qsl.net
locale: "en-US"
timezone: America/New_York
title_separator: "|"
markdown: kramdown

# Build settings
#theme: minima

theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "air"

# Include the "_pages" directory and sub-directory
include: ["_pages"]

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - Makefile
  - README.md
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Layout Default Settings
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      share: false
      related: false

# Site Author Information
author:
  name: "JHU Applied Physics Lab Amateur Radio Club (W3APL)"
  avatar: "/assets/images/w3apl_avatar.jpg"
  bio: >-
    W3APL is the Amateur Radio Club station of the Johns Hopkins University
    Applied Physics Laboratory in Laurel, MD.
  location: "FM19ne - Maryland, USA"
  links:
    - label: "W3APL on qrz.com"
      icon: "fa-solid fa-tower-broadcast"
      url: "https://www.qrz.com/db/W3APL"
    - label: "Applied Physics Laboratory"
      icon: "fa-solid fa-flask-vial"
      url: "https://www.jhuapl.edu"
  
atom_feed:
  hide: false

# Default image for link previews (Facebook, Discord, etc.) via jekyll-seo-tag
og_image: /assets/images/w3apl_og.jpg

# Archive pages (see _pages/tags.md and _pages/categories.md). Setting these
# also turns on the tag/category links at the bottom of each post.
tag_archive:
  type: liquid
  path: /tags/
category_archive:
  type: liquid
  path: /categories/

sass:
  quiet_deps: true
  silence_deprecations: ["import"]